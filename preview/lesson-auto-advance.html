<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Twin Lesson Preview</title><style>body{margin:0;background:#07080b;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.phone{width:min(430px,100%);min-height:100vh;background:#0d0f13;padding:24px;box-sizing:border-box}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;color:#9aa0aa;letter-spacing:.12em}.bar{height:5px;background:#222;border-radius:9px;overflow:hidden;margin:18px 0}.bar i{display:block;height:100%;background:#b6ff3b;transition:.3s}.card{border-top:1px solid #2a2d34;padding-top:26px}h1{font-size:34px;margin:8px 0 6px}h2{font-size:28px;margin:18px 0}.native{background:#17191f;padding:12px 14px;border-radius:14px;color:#dfe3ea;margin:14px 0}.opts{display:grid;gap:10px}.opts button,.cta{padding:16px;border-radius:16px;border:1px solid #2c3038;background:#14171c;color:#fff;font-size:16px}.opts button.sel{border-color:#b6ff3b}.cta{width:100%;margin-top:18px;background:#fff;color:#000;font-weight:700}.feedback{margin-top:18px;padding:14px;border-top:1px solid #2c3038}.good{color:#b6ff3b}.done{text-align:center;padding-top:80px}.done strong{font-size:64px;color:#b6ff3b}</style></head><body><main class="phone"><div class="top"><span class="eyebrow">ENGLISH TWIN · A1</span><span id="count"></span></div><h1>الدرس التجريبي</h1><div class="bar"><i id="progress"></i></div><section class="card" id="card"></section></main><script>const qs=[{ar:'اختر الجملة الصحيحة للتعريف بنفسك.',q:'Choose the natural introduction.',o:['Goodbye, I am Amir.','Hi, I’m Amir.','See you, my name.'],a:'Hi, I’m Amir.',x:'“Hi, I’m …” طريقة طبيعية للتعريف بنفسك.'},{ar:'اختر الفعل الصحيح مع I.',q:'I ___ from Tunisia.',o:['is','am','are'],a:'am',x:'مع I نستعمل am.'},{ar:'اختر العبارة الأكثر تهذيبًا.',q:'You want a coffee.',o:['Coffee.','Give me coffee.','I’d like a coffee, please.'],a:'I’d like a coffee, please.',x:'I’d like …, please صيغة طبيعية ومهذبة.'}];let i=0,sel='';const c=document.getElementById('card'),count=document.getElementById('count'),p=document.getElementById('progress');function render(){if(i>=qs.length){count.textContent='';p.style.width='100%';c.innerHTML='<div class="done"><span class="eyebrow">LESSON COMPLETE</span><h2>أحسنت</h2><strong>✓</strong><p>تم الانتقال بين الأسئلة تلقائيًا وحفظ نهاية الدرس في النسخة الحقيقية.</p></div>';return}const x=qs[i];count.textContent=(i+1)+' / '+qs.length;p.style.width=(i/qs.length*100)+'%';c.innerHTML='<div class="native">'+x.ar+'<br><small>الإجابة المطلوبة بالإنجليزية</small></div><h2 dir="ltr">'+x.q+'</h2><div class="opts" dir="ltr">'+x.o.map(v=>'<button data-v="'+v.replace(/"/g,'&quot;')+'">'+v+'</button>').join('')+'</div><button class="cta" id="check" disabled>تحقق</button>';c.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{sel=b.dataset.v;c.querySelectorAll('.opts button').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');document.getElementById('check').disabled=false});document.getElementById('check').onclick=()=>{const ok=sel===x.a;c.insertAdjacentHTML('beforeend','<div class="feedback"><b class="'+(ok?'good':'')+'">'+(ok?'صحيح ✓':'الإجابة الصحيحة: '+x.a)+'</b><p>'+x.x+'</p><small>السؤال التالي يفتح تلقائيًا…</small></div>');document.getElementById('check').disabled=true;setTimeout(()=>{i++;sel='';render()},1100)}}render();</script></body></html>
