plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def hasReleaseSigning = keystorePath && file(keystorePath).exists() &&
        System.getenv('ANDROID_KEYSTORE_PASSWORD') &&
        System.getenv('ANDROID_KEY_ALIAS') &&
        System.getenv('ANDROID_KEY_PASSWORD')
def googleWebClientId = System.getenv('GOOGLE_WEB_CLIENT_ID') ?: 'MISSING_GOOGLE_WEB_CLIENT_ID'

android {
    namespace 'com.amirhamrouni.englishtwin'
    compileSdk 36

    defaultConfig {
        applicationId 'com.amirhamrouni.englishtwin'
        minSdk 23
        targetSdk 36
        versionCode 6
        versionName '1.1.4'
        resValue 'string', 'default_web_client_id', googleWebClientId
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEYSTORE_ALIAS') ?: System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
