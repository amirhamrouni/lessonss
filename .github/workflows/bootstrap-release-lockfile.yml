name: Bootstrap Release Lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-release-lockfile.yml"

permissions:
  contents: write

jobs:
  lock-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Generate deterministic npm lockfile
        run: npm install --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit verified lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "Lock production dependency graph"
          git push origin HEAD:main
