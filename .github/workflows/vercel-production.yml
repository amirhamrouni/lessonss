name: Vercel Production Deploy

on:
  workflow_run:
    workflows: ["English Twin CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_UKAtfO6HzAtWy9WQ5YuXlPLC
      VERCEL_PROJECT_ID: prj_K9rnIux35nOOObmtJ0MdhschrwFs
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN GitHub secret is required for production deployment." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Pull production configuration
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy verified build to production
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
