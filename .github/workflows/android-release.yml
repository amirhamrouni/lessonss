name: Android Play Bundle

on:
  push:
    branches: [main, release/android-play-hardening]
    paths:
      - 'android/**'
      - 'docs/GOOGLE_PLAY_RELEASE.md'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'docs/GOOGLE_PLAY_RELEASE.md'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: ECC release preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/com/amirhamrouni/englishtwin/MainActivity.java
          grep -q "applicationId 'com.amirhamrouni.englishtwin'" android/app/build.gradle
          grep -q "targetSdk 36" android/app/build.gradle
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'CredentialManager' android/app/src/main/java/com/amirhamrouni/englishtwin/MainActivity.java
          grep -q 'EnglishTwinAndroid' android/app/src/main/java/com/amirhamrouni/englishtwin/MainActivity.java
          grep -q 'english-twin-native-preview.vercel.app' android/app/src/main/java/com/amirhamrouni/englishtwin/MainActivity.java
          if grep -Rqi 'trusted.LauncherActivity\|androidbrowserhelper' android/app/src/main android/app/build.gradle; then
            echo 'Legacy TWA code/dependency detected; release architecture must remain the verified native WebView + Credential Manager path.' >&2
            exit 1
          fi

      - name: Validate Google native auth config
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID="${GOOGLE_WEB_CLIENT_ID:-}"
          if [ -z "$CLIENT_ID" ]; then
            CLIENT_ID="$(sed -n "s/.*googleWebClientId = System.getenv('GOOGLE_WEB_CLIENT_ID') ?: '\([^']*\)'.*/\1/p" android/app/build.gradle)"
          fi
          case "$CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) echo 'A valid Web OAuth client ID is required for native Google Sign-In.' >&2; exit 1 ;;
          esac
          echo 'Native Google Sign-In Web OAuth client configuration: valid'

      - name: Configure stable Android signing
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || { echo 'Missing ANDROID_KEYSTORE_BASE64' >&2; missing=1; }
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] || { echo 'Missing ANDROID_KEYSTORE_PASSWORD' >&2; missing=1; }
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || { echo 'Missing ANDROID_KEY_ALIAS' >&2; missing=1; }
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] || { echo 'Missing ANDROID_KEY_PASSWORD' >&2; missing=1; }
          [ "$missing" -eq 0 ] || { echo 'Stable Android signing is mandatory. Refusing to create OAuth-unstable debug APKs.' >&2; exit 1; }

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release-upload.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/android/release-upload.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/release-upload.jks" >> "$GITHUB_ENV"
          echo 'Stable signing key loaded.'

      - name: Print stable signing fingerprints
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -E 'SHA1:|SHA256:'

      - name: Lint release
        run: gradle -p android :app:lintRelease --no-daemon

      - name: Build stable installable release APK
        run: gradle -p android :app:assembleRelease --no-daemon

      - name: Verify stable APK and print signing fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload stable installable APK
        uses: actions/upload-artifact@v4
        with:
          name: english-twin-stable-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release AAB
        run: gradle -p android :app:bundleRelease --no-daemon

      - name: Verify signed release bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          # Android upload/app-signing certificates are intentionally self-signed.
          # `-strict` incorrectly turns that normal condition into a CI failure.
          jarsigner -verify "$AAB"

          expected_sha256="$(keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual_sha256="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [ -n "$expected_sha256" ]
          [ -n "$actual_sha256" ]
          [ "$expected_sha256" = "$actual_sha256" ] || {
            echo 'AAB signer fingerprint does not match configured stable keystore.' >&2
            exit 1
          }
          echo "AAB signature valid; signer SHA-256 matches stable keystore: $actual_sha256"

      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: english-twin-play-signed-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Release summary
        run: |
          echo "### English Twin Android release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- applicationId: com.amirhamrouni.englishtwin" >> "$GITHUB_STEP_SUMMARY"
          echo "- targetSdk: 36" >> "$GITHUB_STEP_SUMMARY"
          echo "- architecture: native WebView shell + Credential Manager" >> "$GITHUB_STEP_SUMMARY"
          echo "- native Google Sign-In: verified configuration gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- signing: stable mandatory certificate" >> "$GITHUB_STEP_SUMMARY"
          echo "- installable APK: signed release artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Play AAB: signed release artifact" >> "$GITHUB_STEP_SUMMARY"
