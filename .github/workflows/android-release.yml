name: Android Play Bundle

on:
  push:
    branches: [main, release/android-play-hardening]
    paths:
      - 'android/**'
      - 'docs/GOOGLE_PLAY_RELEASE.md'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'docs/GOOGLE_PLAY_RELEASE.md'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: ECC release preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/com/amirhamrouni/englishtwin/MainActivity.java
          grep -q "applicationId 'com.amirhamrouni.englishtwin'" android/app/build.gradle
          grep -q "targetSdk 36" android/app/build.gradle
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'CredentialManager' android/app/src/main/java/com/amirhamrouni/englishtwin/MainActivity.java
          grep -q 'EnglishTwinAndroid' android/app/src/main/java/com/amirhamrouni/englishtwin/MainActivity.java
          grep -q 'english-twin-native-preview.vercel.app' android/app/src/main/java/com/amirhamrouni/englishtwin/MainActivity.java
          if grep -Rqi 'trusted.LauncherActivity\|androidbrowserhelper' android/app/src/main android/app/build.gradle; then
            echo 'Legacy TWA code/dependency detected; release architecture must remain the verified native WebView + Credential Manager path.' >&2
            exit 1
          fi

      - name: Validate Google native auth config
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID="${GOOGLE_WEB_CLIENT_ID:-}"
          if [ -z "$CLIENT_ID" ]; then
            CLIENT_ID="$(sed -n "s/.*googleWebClientId = System.getenv('GOOGLE_WEB_CLIENT_ID') ?: '\([^']*\)'.*/\1/p" android/app/build.gradle)"
          fi
          case "$CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) echo 'A valid Web OAuth client ID is required for native Google Sign-In.' >&2; exit 1 ;;
          esac
          echo 'Native Google Sign-In Web OAuth client configuration: valid'

      - name: Configure Play upload signing
        shell: bash
        run: |
          set -euo pipefail
          configured=0
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && configured=$((configured+1))
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && configured=$((configured+1))
          [ -n "${ANDROID_KEY_ALIAS:-}" ] && configured=$((configured+1))
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] && configured=$((configured+1))

          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo 'Partial Android signing configuration detected. Configure all four signing secrets or none.' >&2
            exit 1
          fi

          if [ "$configured" -eq 4 ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release-upload.jks"
            keytool -list -keystore "$GITHUB_WORKSPACE/android/release-upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/release-upload.jks" >> "$GITHUB_ENV"
            echo "PLAY_BUNDLE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "PLAY_BUNDLE_SIGNED=false" >> "$GITHUB_ENV"
            echo 'Signing secrets are absent: CI will create a QA-only unsigned AAB, never label it Play-ready.'
          fi

      - name: Lint release
        run: gradle -p android :app:lintRelease --no-daemon

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Verify APK and print signing fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: english-twin-installable-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release AAB
        run: gradle -p android :app:bundleRelease --no-daemon

      - name: Verify bundle exists
        run: test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Verify signed release bundle
        if: env.PLAY_BUNDLE_SIGNED == 'true'
        run: jarsigner -verify -strict android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed Play AAB
        if: env.PLAY_BUNDLE_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: english-twin-play-signed-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned QA AAB
        if: env.PLAY_BUNDLE_SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: english-twin-qa-unsigned-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Release summary
        run: |
          echo "### English Twin Android release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- applicationId: com.amirhamrouni.englishtwin" >> "$GITHUB_STEP_SUMMARY"
          echo "- targetSdk: 36" >> "$GITHUB_STEP_SUMMARY"
          echo "- architecture: native WebView shell + Credential Manager" >> "$GITHUB_STEP_SUMMARY"
          echo "- native Google Sign-In: verified configuration gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- debug APK signature: printed in CI log" >> "$GITHUB_STEP_SUMMARY"
          echo "- Play upload signed AAB: $PLAY_BUNDLE_SIGNED" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PLAY_BUNDLE_SIGNED" != "true" ]; then
            echo "- status: QA ONLY — signing secrets are not configured" >> "$GITHUB_STEP_SUMMARY"
          fi
