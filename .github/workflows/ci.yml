name: English Twin CI

on:
  push:
    branches: [main, english-twin-pro, ecc-release-hardening]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: english-twin-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload deployment source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: english-twin-deployment-source
          path: |
            .env.example
            api/
            src/
            index.html
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
            vercel.json
          if-no-files-found: error
          retention-days: 7
