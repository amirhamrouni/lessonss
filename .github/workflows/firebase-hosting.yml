name: Firebase Hosting Deploy

on:
  workflow_run:
    workflows: ["English Twin CI"]
    types: [completed]

permissions:
  contents: read
  checks: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0217548336 }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip until Firebase credential is connected
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "Firebase Hosting auto-deploy is prepared. Connect the Firebase GitHub service-account secret once and future main pushes will deploy automatically."

      - name: Setup Node
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm install

      - name: Build
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm run build

      - name: Deploy Hosting
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0217548336 }}
          channelId: live
          projectId: gen-lang-client-0217548336
